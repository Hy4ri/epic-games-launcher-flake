name: Build Check

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build and verify flake
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Build packages
        run: |
          nix flake check --no-build
          nix build .#epic-games-launcher-unwrapped .#epic-games-launcher-fhs .#default --no-link
